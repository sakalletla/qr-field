# Local Postgres + Redis (see ../QRField-Technical-Stack.md)
# Run the Next.js image too: docker compose --profile app up --build
# AUTH_SECRET: set in `.env` or use the compose default below (local Docker only — override in real deploys).

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: qrfield
      POSTGRES_PASSWORD: qrfield
      POSTGRES_DB: qrfield
    ports:
      - "5432:5432"
    volumes:
      - qrfield_pg:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  app:
    profiles: ["app"]
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      AUTH_SECRET: ${AUTH_SECRET:-local-docker-dev-only-secret-min-32-characters}
      AUTH_URL: ${AUTH_URL:-http://localhost:3000}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      DATABASE_URL: ${DATABASE_URL:-postgresql://qrfield:qrfield@postgres:5432/qrfield}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      - postgres
      - redis

volumes:
  qrfield_pg:
